name: pr-check # Workflow name

# ---------------------------------------------------------
# Trigger: on pull requests that TARGET main or develop
# ---------------------------------------------------------
on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      # 1) Print PR number
      - name: Show PR number
        run: |
          echo "PR number: ${{ github.event.pull_request.number }}"

      # 2) Print source branch (where the PR comes FROM)
      #    This is the head ref.
      - name: Show source branch
        run: |
          echo "Source branch: ${{ github.head_ref }}"

      # 3) Print target branch (where the PR is going TO)
      #    This is the base ref.
      - name: Show target branch
        run: |
          echo "Target branch: ${{ github.base_ref }}"
