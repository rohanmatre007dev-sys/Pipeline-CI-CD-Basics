name: concurrency-demo # Workflow name

# ---------------------------------------------------------
# Trigger: on push to main and develop branches
# ---------------------------------------------------------
on:
  push:
    branches:
      - main
      - develop

# ---------------------------------------------------------
# Concurrency:
# - Group by workflow name + branch
# - Cancel any in-progress run when a new one starts
# ---------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  concurrency-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Print active workflow info
        run: |
          echo "Running latest workflow for branch: ${{ github.ref_name }}"
